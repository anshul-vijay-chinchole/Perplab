[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perplab"
version = "0.1.0"
description = "Code-first algorithmic trading platform for Binance USD-M perpetual futures"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15",
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# The API server is an extra rather than a base dependency so that the collector -- the
# one process that must start on a machine where the UI has never been opened -- does not
# carry FastAPI's dependency tree. `perplab serve` imports it lazily and says what to
# install if it is absent.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.0",
    "perplab[api]",
]

[project.scripts]
perplab = "perplab.cli:main"

[tool.setuptools.packages.find]
include = ["perplab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
# Keep the "no Decimal outside the accounting seam" test loud rather than skippable.
filterwarnings = ["error::DeprecationWarning"]
markers = [
    # Tests that spawn worker subprocesses and replay a lake. They are part of the ordinary
    # run -- spec 12.1's reproducibility invariant is only enforced if it is actually
    # enforced -- and are marked so a tight edit loop can say `-m "not slow"` deliberately
    # rather than by forgetting to run them.
    "slow: spawns subprocesses or replays a generated lake",
]
